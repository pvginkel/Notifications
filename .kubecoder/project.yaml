# Curated entry points for Notifications: a uv workspace whose members are the
# notification platform's apps, one directory per deployable (`bridge/` first).
#
# Why the apps will NOT be separate components: they are members of one uv
# workspace under one ruff config and one pytest config, whose discovery from the
# root reaches every member. A component per app would make a full
# `kc project test` run the same suite once per app, so `root` owns the whole
# Python gate. A component is for a build unit whose toolchain differs. To run
# one app's tests alone: `cexec python uv run --all-packages pytest <app dir>`.
#
# Toolchain commands carry their `cexec` prefix here and only here: a script
# Jenkins also runs stays cexec-free, because Jenkins has neither `cexec` nor `kc`.
#
# No `build:`: images stay out of it, because the Jenkins job builds them with
# `helmCharts.kaniko2`. Prove a Dockerfile by hand from the repo root with
# `kaniko --dockerfile <app>/Dockerfile --no-push`, never a `dev-*` or `prd-*` tag.

projects:
  root:
    description: >-
      The uv workspace of the notification platform's apps (the bridge first):
      one ruff config and one pytest config over the whole Python tree.
    jenkins: Notifications
    # --all-packages: the root is package = false, so a plain `uv sync` installs
    # only the root's dev group and none of the members.
    setup: cexec python uv sync --all-packages --locked
    lint:
      - cexec python uv run --all-packages ruff check .
      - cexec python uv run --all-packages ruff format --check .
    test: cexec python uv run --all-packages pytest
