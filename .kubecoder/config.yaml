# The environment for Notifications, the notification platform that puts one
# API over ntfy and Telegram: its apps (a uv workspace, the bridge first), and
# the repos its work touches.
# Schema: https://kubecoder.home/help/reference/config-yaml/

repos:
  # Its spec repo: the design and its slices. Shared: one clone per project,
  # mounted into every environment of it, because parallel sessions read and
  # append to the one working tree.
  - url: https://github.com/pvginkel/NotificationsSpecs
    shared: true
  # Where Notifications deploys: the chart running ntfy and the bridge in one
  # pod, and its prd values, which CI pins the image into. Argo CD syncs it.
  - url: https://github.com/pvginkel/NotificationsDeploy

capabilities:
  github: rw
  # ~/.kube/config-prd-write: the slice test plan's deployed submits exec into
  # the bridge container in prd.
  kubePrdWrite: true

tools:
  # The apps' uv workspace: Python with uv and ruff.
  - use: python
  # NotificationsDeploy's Helm and Terraform gates.
  - use: iac
  # Its architecture gates: gen-architecture and arch-validate.
  - use: aac-tools

# Proves the apps' Dockerfiles with `kaniko --no-push` before a push hands
# them to Jenkins.
imageBuilder: true

preamble:
  instructions: |
    Notifications' environment: the platform's apps (/work/Notifications, a
    uv workspace with one member per app, the bridge first), with their
    design and slices in /work/NotificationsSpecs and their deployment in
    /work/NotificationsDeploy.

    Three toolchain sidecars:

      cexec python      Python with uv and ruff: the apps' workspace, whose
                        gates are `kc project` from /work/Notifications.
      cexec iac         Terraform and Helm: the deploy repo's gates.
      cexec aac-tools   gen-architecture and arch-validate: the deploy
                        repo's architecture gates.

    `kaniko --no-push` proves a Dockerfile; never push a `dev-*` or `prd-*`
    tag from here, those are Jenkins'.

    /work/NotificationsSpecs is a SHARED working tree: stage files by name
    there, never `git add -A`.
